
name: presales-restore-test

services:
  ollama:
    image: ollama/ollama:latest
    container_name: presales-ollama-restore
    restart: "no"
    gpus: all
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_restore:/root/.ollama
    networks:
      - restore_network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: presales-webui-restore
    restart: "no"
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
    volumes:
      - webui_restore:/app/backend/data
    networks:
      - restore_network

volumes:
  ollama_restore:
    external: true
    name: presales-ollama-restore-test

  webui_restore:
    external: true
    name: presales-webui-restore-test

networks:
  restore_network:
    driver: bridge

